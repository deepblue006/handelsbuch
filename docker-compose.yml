# Reproduzierbare lokale Umgebung: PostgreSQL + Dashboard + Aktualisierungsdienst.
# Start: docker compose up -d --build   (vorher .env anlegen, siehe .env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handelsbuch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: handelsbuch
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handelsbuch"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://handelsbuch:${POSTGRES_PASSWORD:-change_me}@db:5432/handelsbuch?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "npx prisma migrate deploy && npx next start -H 0.0.0.0 -p 3000"

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://handelsbuch:${POSTGRES_PASSWORD:-change_me}@db:5432/handelsbuch?schema=public
    depends_on:
      app:
        condition: service_started
    command: npx tsx scripts/scheduler.ts

volumes:
  pgdata:
